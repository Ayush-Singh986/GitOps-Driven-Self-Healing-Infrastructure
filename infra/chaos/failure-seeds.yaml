apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-oom-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-oom
  template:
    metadata:
      labels:
        app: chaos-oom
    spec:
      containers:
      - name: memory-hog
        image: polinux/stress
        args: ["--vm", "1", "--vm-bytes", "1G"]
        resources:
          limits:
            memory: "128Mi" # Force OOMKilled
          requests:
            memory: "64Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-crashloop-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-crashloop
  template:
    metadata:
      labels:
        app: chaos-crashloop
    spec:
      containers:
      - name: crash-app
        image: busybox
        command: ["sh", "-c", "sleep 5; echo 'Crashing...'; exit 1"]
        resources:
          limits:
            memory: "64Mi"
          requests:
            memory: "32Mi"
