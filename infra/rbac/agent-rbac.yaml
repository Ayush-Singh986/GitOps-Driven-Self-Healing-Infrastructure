apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-remediation-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-remediation-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-remediation-binding
subjects:
- kind: ServiceAccount
  name: ai-remediation-agent
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ai-remediation-role
  apiGroup: rbac.authorization.k8s.io
